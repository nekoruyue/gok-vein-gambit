services:
  - type: web
    name: gok-vein-gambit
    runtime: node
    plan: free
    region: singapore
    buildCommand: "npm install"
    startCommand: "node server/server.js"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: TRIAL_KEEPALIVE
        value: "1"
      - key: NODE_VERSION
        value: "20"
